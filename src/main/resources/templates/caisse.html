<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Pharmacie - Caisse</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header class="navbar">
    <a class="brand" th:href="@{/}"> Pharmacie</a>
    <nav>
        <a th:href="@{/medicaments}">Médicaments</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
        <a th:href="@{/caisse}">Caisse</a>
        <a th:href="@{/client}">Espace client</a>
        <span class="user-info" sec:authentication="name">utilisateur</span>
        <form class="inline" th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger">Déconnexion</button>
        </form>
    </nav>
</header>

<main class="container">
    <h1>Caisse - Enregistrement des ventes</h1>
    <p>Accès réservé aux rôles ADMIN, PHARMACIEN et CAISSIER.</p>

    <h2>Catalogue disponible</h2>
    <table>
        <thead>
        <tr>
            <th>#</th>
            <th>Nom</th>
            <th>Prix (DH)</th>
            <th>Code-barre</th>
            <th>Catégorie</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${produits}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.nom}">Nom</td>
            <td th:text="${p.prix}">0.00</td>
            <td th:text="${p.codeBarre}">CB</td>
            <td th:text="${p.categorie != null} ? ${p.categorie.nom} : '—'">Cat</td>
        </tr>
        <tr th:if="${#lists.isEmpty(produits)}">
            <td colspan="5" style="text-align:center;">Aucun produit.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
