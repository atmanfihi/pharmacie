<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>Pharmacie - Médicaments</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<header class="navbar">
    <a class="brand" th:href="@{/}"> Pharmacie</a>
    <nav>
        <a sec:authorize="hasAnyRole('ADMIN','PHARMACIEN')" th:href="@{/medicaments}">Médicaments</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
        <a sec:authorize="hasAnyRole('ADMIN','PHARMACIEN','CAISSIER')" th:href="@{/caisse}">Caisse</a>
        <a th:href="@{/client}">Espace client</a>
        <span class="user-info" sec:authentication="name">utilisateur</span>
        <form class="inline" th:action="@{/logout}" method="post">
            <button type="submit" class="btn btn-danger">Déconnexion</button>
        </form>
    </nav>
</header>

<main class="container">
    <h1>Gestion des médicaments</h1>

    <div th:if="${message}" class="flash" th:text="${message}">message</div>

    <p style="margin-bottom: 1rem;">
        <a class="btn btn-success" th:href="@{/medicaments/form}">+ Nouveau produit</a>
    </p>

    <table>
        <thead>
        <tr>
            <th>#</th>
            <th>Nom</th>
            <th>Prix (DH)</th>
            <th>Code-barre</th>
            <th>Expiration</th>
            <th>Catégorie</th>
            <th>Fournisseur</th>
            <th>Tags</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${produits}">
            <td th:text="${p.id}">1</td>
            <td>
                <a th:href="@{/medicaments/{id}(id=${p.id})}" th:text="${p.nom}">Nom</a>
            </td>
            <td th:text="${p.prix}">0.00</td>
            <td th:text="${p.codeBarre}">CB</td>
            <td th:text="${p.dateExpiration}">2026-01-01</td>
            <td th:text="${p.categorie != null} ? ${p.categorie.nom} : '—'">Cat</td>
            <td th:text="${p.fournisseur != null} ? ${p.fournisseur.nom} : '—'">Four</td>
            <td>
                <span class="tag" th:each="t : ${p.tags}" th:text="${t.libelle}">tag</span>
            </td>
            <td>
                <a class="btn btn-primary" th:href="@{/medicaments/{id}(id=${p.id})}">Voir</a>
                <a class="btn btn-warning" th:href="@{/medicaments/form(id=${p.id})}">Modifier</a>
                <form class="inline" th:action="@{/medicaments/{id}/delete(id=${p.id})}" method="post"
                      onsubmit="return confirm('Supprimer ce produit ?');">
                    <button type="submit" class="btn btn-danger">Supprimer</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(produits)}">
            <td colspan="9" style="text-align:center;">Aucun produit en stock.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
